<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080b18">

  <title>Page Not Found | I FIND AI</title>

  <meta name="robots" content="noindex, follow">
  <meta name="description" content="The page you are looking for could not be found. Return to I FIND AI.">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(ellipse at 50% 35%, #17295a 0%, transparent 55%),
        #080b18;
      color: #f2f5ff;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    .error-content {
      max-width: 520px;
    }

    .error-code {
      font-size: clamp(90px, 22vw, 160px);
      font-weight: 900;
      line-height: 1;
      letter-spacing: -8px;
      background: linear-gradient(110deg, #a98aff, #35dfff);
      background-clip: text;
      -webkit-background-clip: text;
      color: transparent;
    }

    h1 {
      font-size: clamp(25px, 6vw, 36px);
      margin: 20px 0 12px;
    }

    p {
      color: #b6c2df;
      line-height: 1.7;
      font-size: 16px;
    }

    .home-button {
      display: inline-block;
      margin-top: 22px;
      padding: 15px 28px;
      border-radius: 30px;
      color: white;
      background: linear-gradient(100deg, #477fff, #965cff);
      text-decoration: none;
      font-weight: bold;
    }

    .home-button:focus-visible {
      outline: 3px solid white;
      outline-offset: 4px;
    }

    .brand {
      margin-top: 55px;
      color: #7e9dff;
      font-size: 13px;
      font-weight: bold;
      letter-spacing: 4px;
    }
  </style>
</head>

<body>
  <main class="error-content">

    <div class="error-code">404</div>

    <h1>Oops! Page Not Found</h1>

    <p>
      Looks like this page went missing.
      The URL may be incorrect or the page may have moved.
    </p>

    <a
      class="home-button"
      href="/I-find-ai/"
    >
      Back to I FIND AI →
    </a>

    <div class="brand">I FIND AI</div>

  </main>
</body>
</html>
