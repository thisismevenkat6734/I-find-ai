
name: Build and Deploy I FIND AI

on:
  push:
    branches:
      - main
    paths:
      - "index.html"
      - "style.css"
      - "script.js"
      - "image-engine.js"
      - "video-engine.js"
      - "video-ui.js"
      - "writing-engine.js"
      - "writing-ui.js"
      - "assets/**"
      - ".github/workflows/deploy-engine.yml"
      - "manifest.json"
      - "sw.js"
      - "privacy.html"
      - "terms.html"

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare website
        run: |
          mkdir -p _site
          rsync -av ./ _site/ \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='_site' \
            --exclude='node_modules'

      - name: Verify website files
        run: |
          echo "Checking main website..."
          test -f _site/index.html

          echo "Checking video engine..."
          test -f _site/video-engine.js
          test -f _site/video-ui.js

          echo "Website files verified successfully."
          find _site -maxdepth 2 -type f -print

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
