<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080b18">

  <title>You're Offline | I FIND AI</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #080b18;
      color: #edf1ff;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    .offline-container {
      width: 100%;
      max-width: 480px;
    }

    .offline-icon {
      width: 100px;
      height: 100px;
      margin: 0 auto 28px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(125, 145, 255, 0.35);
      border-radius: 50%;
      background: rgba(110, 125, 255, 0.1);
      font-size: 44px;
      box-shadow: 0 0 50px rgba(105, 110, 255, 0.15);
    }

    h1 {
      font-size: clamp(28px, 7vw, 38px);
      margin-bottom: 14px;
    }

    p {
      color: #aeb9d5;
      line-height: 1.7;
      font-size: 16px;
    }

    .brand {
      margin-top: 35px;
      color: #8fa5ff;
      font-weight: bold;
      letter-spacing: 3px;
      font-size: 13px;
    }

    button {
      margin-top: 25px;
      padding: 14px 26px;
      border: 0;
      border-radius: 30px;
      background: linear-gradient(100deg, #6675ff, #9b65ff);
      color: white;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    button:focus-visible {
      outline: 3px solid white;
      outline-offset: 4px;
    }
  </style>
</head>

<body>
  <main class="offline-container">

    <div class="offline-icon" aria-hidden="true">
      <span>📡</span>
    </div>

    <h1>You're Offline</h1>

    <p>
      It looks like your internet connection is unavailable.
      Please reconnect and try again.
    </p>

    <p>
      Previously cached website pages may still be available.
      AI content analysis requires the relevant detection
      functionality and processing resources to be available.
    </p>

    <button type="button" onclick="window.location.reload()">
      Try Again
    </button>

    <div class="brand">I FIND AI</div>

  </main>
</body>
</html>
